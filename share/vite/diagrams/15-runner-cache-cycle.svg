<rect x="660" y="1784" width="460" height="113" rx="12" fill="#eff6ff" stroke="#9db3d4" stroke-width="1.5"/>
<text class="rc-text" x="890.0" y="1814" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="890.0" dy="0">本次 cachedRequest()</tspan>
</text>
<text class="rc-text" x="890.0" y="1842" font-size="17" text-anchor="middle">
<tspan x="890.0" dy="0">无 promise → directRequest()，登记新 P</tspan>
