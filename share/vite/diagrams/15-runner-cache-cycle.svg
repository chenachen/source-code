</text>
<text class="rc-text" x="40" y="1982" font-size="16" text-anchor="start" style="fill:#526079">
<tspan x="40" dy="0">源码：runner.ts::getModuleInformation/cachedRequest/directRequest · evaluatedModules.ts::invalidateModule</tspan>
