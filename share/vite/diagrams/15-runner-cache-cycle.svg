<rect x="660" y="1630" width="460" height="123" rx="12" fill="#fff7ed" stroke="#d9a968" stroke-width="1.5"/>
<text class="rc-text" x="890.0" y="1660" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="890.0" dy="0">清旧状态 → 写本次 meta</tspan>
</text>
<text class="rc-text" x="890.0" y="1688" font-size="17" text-anchor="middle">
<tspan x="890.0" dy="0">清 meta / map / promise / exports / imports</tspan>
<tspan x="890.0" dy="25">evaluated=false；保留 importers</tspan>
