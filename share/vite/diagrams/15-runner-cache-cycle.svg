<path class="rc-line" d="M115 1473 V1540 H40 V620 H275 V637" stroke="#b45309" marker-end="url(#rc-amber-arrow)"/>
<text class="rc-text" x="125" y="1506" font-size="17" text-anchor="start" style="fill:#b45309">
<tspan x="125" dy="0">下次导入重新取 meta</tspan>
</text>
<rect x="425" y="1440" width="310" height="115" rx="12" fill="#eff6ff" stroke="#9db3d4" stroke-width="1.5"/>
<text class="rc-text" x="580.0" y="1470" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="580.0" dy="0">后续导入：先缓存握手</tspan>
</text>
<text class="rc-text" x="580.0" y="1498" font-size="17" text-anchor="middle">
<tspan x="580.0" dy="0">getModuleInformation(url)</tspan>
<tspan x="580.0" dy="25">await fetchModule(cached:!!meta)</tspan>
