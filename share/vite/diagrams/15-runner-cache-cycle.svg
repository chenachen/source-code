<tspan x="580.0" dy="0">本次请求结束</tspan>
</text>
<text class="rc-text" x="580.0" y="1364" font-size="17" text-anchor="middle">
<tspan x="580.0" dy="0">返回 namespace / 抛出 E</tspan>
</text>
<text class="rc-section" x="60" y="1324">后续导入与失效</text>
<rect x="50" y="1360" width="310" height="113" rx="12" fill="#fff7ed" stroke="#d9a968" stroke-width="1.5"/>
<text class="rc-text" x="205.0" y="1390" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="205.0" dy="0">本地 HMR 失效</tspan>
</text>
<text class="rc-text" x="205.0" y="1418" font-size="17" text-anchor="middle">
<tspan x="205.0" dy="0">invalidateModule 清旧状态</tspan>
<tspan x="205.0" dy="25">清 meta；下次导入重新 fetch</tspan>
</text>
<path class="rc-line" d="M810 1274 H770 V1418 H360" stroke="#b45309" marker-end="url(#rc-amber-arrow)"/>
<text class="rc-text" x="779" y="1385" font-size="17" text-anchor="start" style="fill:#b45309">
<tspan x="779" dy="0">HMR</tspan>
