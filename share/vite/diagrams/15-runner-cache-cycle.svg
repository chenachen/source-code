</text>
<rect x="50" y="1630" width="470" height="123" rx="12" fill="#f0fdfa" stroke="#9ccbc3" stroke-width="1.5"/>
<text class="rc-text" x="285.0" y="1660" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="285.0" dy="0">复用已有求值 Promise</tspan>
</text>
<text class="rc-text" x="285.0" y="1688" font-size="17" text-anchor="middle">
<tspan x="285.0" dy="0">保留旧 meta / exports / P</tspan>
<tspan x="285.0" dy="25">evaluated=true：直接 await 原 P</tspan>
<tspan x="285.0" dy="25">返回 namespace / 抛出同一个 E</tspan>
</text>
<path class="rc-line" d="M660 1555 V1593 H890 V1630" stroke="#b45309" marker-end="url(#rc-amber-arrow)"/>
