<tspan x="386.5" dy="0">是</tspan>
</text>
<rect x="44" y="748" width="288" height="100" rx="12" fill="#e9f7ee" stroke="#18734a" stroke-width="1.7"/>
<text class="hp-label" x="188.0" y="780.0" text-anchor="middle">
<tspan x="188.0" dy="0">登记 (node, node) 边界</tspan>
<tspan x="188.0" dy="25">path = acceptedPath = node</tspan>
<tspan x="188.0" dy="25">停止该分支</tspan>
</text>
<path d="M580 842 L580 888" fill="none" stroke="#17659b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hp-arrow-blue)"/>
<text class="hp-edge" x="603" y="875" text-anchor="middle">
<tspan x="603" dy="0">否</tspan>
</text>
<rect x="408" y="888" width="344" height="80" rx="12" fill="#fff7e7" stroke="#bd9347" stroke-width="1.7"/>
<text class="hp-label" x="580.0" y="922.5" text-anchor="middle">
<tspan x="580.0" dy="0">若有 acceptExports：先登记</tspan>
<tspan x="580.0" dy="25">(node, node)；仍核对 importers</tspan>
</text>
<path d="M580 968 L580 991" fill="none" stroke="#17659b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hp-arrow-blue)"/>
