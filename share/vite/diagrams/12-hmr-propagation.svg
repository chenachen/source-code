<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="2330" viewBox="0 0 1160 2330" role="img" aria-labelledby="hp-title hp-desc" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<title id="hp-title">普通 HMR：接受边界与整轮 reload 判定</title>
<desc id="hp-desc">Vite v8.2.1。灰箭头表示 import，蓝箭头表示沿 importers 的反向传播。示例中 P 接受 changed，但 Q 未接受且没有 importer，任一死端使整轮 full reload。下图逐项显示 propagateUpdate 的去重、未分析、自接受、acceptExports、依赖接受与路径环处理；循环先判断还有无 importer，空集合或耗尽返回 false；依赖接受、导出覆盖、普通路径环、递归 false 均回到取下一项，递归 true 立即返回死端。HTML 文档与 invalidate 回到根来源由 updateModules 另行决定。</desc>
<defs>
<marker id="hp-arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#17659b"/></marker>
<marker id="hp-arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18734a"/></marker>
<marker id="hp-arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b13b42"/></marker>
<marker id="hp-arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8296a8"/></marker>
</defs>
<style>.hp-title{font-weight:700;fill:#17324d;font-size:30px} .hp-section{font-weight:700;fill:#17324d;font-size:23px} .hp-label{fill:#17324d;font-size:19px} .hp-small{fill:#456078;font-size:17px} .hp-edge{font-size:18px;fill:#17659b;font-weight:600} .hp-role{font-size:20px;fill:#17324d;font-weight:700}</style>
<rect x="0" y="0" width="1160" height="2330" rx="0" fill="#f7fafc"/>
<text class="hp-title" x="38" y="47" text-anchor="start">
<tspan x="38" dy="0">普通 HMR：沿所有 importer 路径寻找边界</tspan>
</text>
<text class="hp-small" x="38" y="82" text-anchor="start">
<tspan x="38" dy="0">灰线：import 方向   ·   蓝线：反向传播   ·   绿色：边界接管   ·   红色：死端</tspan>
</text>
<rect x="34" y="104" width="1092" height="350" rx="16" fill="#ffffff" stroke="#cad8e3" stroke-width="1.7"/>
<rect x="60" y="135" width="302" height="86" rx="12" fill="#e9f7ee" stroke="#18734a" stroke-width="1.7"/>
<text class="hp-label" x="211.0" y="172.5" text-anchor="middle">
<tspan x="211.0" dy="0">P 显式接受 changed</tspan>
<tspan class="hp-small" x="211.0" dy="25">boundary=P · acceptedVia=changed</tspan>
</text>
<rect x="798" y="135" width="302" height="86" rx="12" fill="#fff0f0" stroke="#b13b42" stroke-width="1.7"/>
<text class="hp-label" x="949.0" y="172.5" text-anchor="middle">
<tspan x="949.0" dy="0">Q 未接受 · 没有 importer</tspan>
<tspan x="949.0" dy="25">到达图根 → dead end</tspan>
</text>
<rect x="430" y="290" width="300" height="66" rx="12" fill="#edf6fc" stroke="#17659b" stroke-width="1.7"/>
<text class="hp-label" x="580.0" y="317.5" text-anchor="middle">
<tspan x="580.0" dy="0">changed.js</tspan>
<tspan x="580.0" dy="25">本例自身未接受更新</tspan>
</text>
