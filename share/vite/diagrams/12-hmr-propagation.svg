</g>
<rect x="34" y="2120" width="1092" height="100" rx="12" fill="#ffffff" stroke="#8296a8" stroke-width="1.7"/>
<text class="hp-label" x="580" y="2152" text-anchor="middle">
<tspan x="580" dy="0">外层 updateModules 汇总每个变更节点：</tspan>
<tspan x="580" dy="25">全部返回 false 且有边界，才发送精确 updates</tspan>
<tspan x="580" dy="25">任一返回 true → full-reload，舍弃精确 updates</tspan>
</text>
<text class="hp-small" x="42" y="2248" text-anchor="start">
<tspan x="42" dy="0">空起点、client HTML 文档、invalidate 边界回到根来源也会在外层 full-reload。</tspan>
</text>
<text class="hp-small" x="42" y="2276" text-anchor="start">
<tspan x="42" dy="0">环内接受边界另带 isWithinCircularImport；浏览器重新 import 失败时可 reload 恢复求值顺序。</tspan>
</text>
<text class="hp-small" x="42" y="2304" text-anchor="start">
<tspan x="42" dy="0">证据：server/hmr.ts · propagateUpdate / updateModules / isNodeWithinCircularImports（Vite v8.2.1）</tspan>
</text>
