<tspan x="410" dy="0">import</tspan>
</text>
<text class="hp-small" x="750" y="243" text-anchor="middle">
<tspan x="750" dy="0">import</tspan>
</text>
<path d="M145 223 L145 398 L410 398" fill="none" stroke="#18734a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#hp-arrow-green)"/>
<path d="M1015 223 L1015 398 L750 398" fill="none" stroke="#b13b42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hp-arrow-red)"/>
<rect x="410" y="369" width="340" height="62" rx="12" fill="#fff0f0" stroke="#b13b42" stroke-width="1.7"/>
<text class="hp-label" x="580.0" y="394.5" text-anchor="middle">
<tspan x="580.0" dy="0">整轮 full-reload</tspan>
<tspan x="580.0" dy="25">P 的接受边界不能阻止刷新</tspan>
</text>
<text class="hp-section" x="580" y="481" text-anchor="middle">
<tspan x="580" dy="0">propagateUpdate：停止条件与递归分支</tspan>
</text>
<rect x="430" y="511" width="300" height="58" rx="12" fill="#edf6fc" stroke="#17659b" stroke-width="1.7"/>
<text class="hp-label" x="580.0" y="547.0" text-anchor="middle">
<tspan x="580.0" dy="0">访问 node</tspan>
</text>
<path d="M580 569 L580 604" fill="none" stroke="#17659b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hp-arrow-blue)"/>
