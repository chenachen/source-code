<tspan x="580" dy="0">无 importer 且</tspan>
<tspan x="580" dy="25">未声明 acceptExports？</tspan>
</text>
<path d="M757 1040 L855 1040" fill="none" stroke="#17659b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hp-arrow-blue)"/>
