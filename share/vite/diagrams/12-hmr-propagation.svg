<tspan x="580" dy="25">传入 currentChain + importer</tspan>
</text>
<path d="M580 1878 L580 1912" fill="none" stroke="#17659b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hp-arrow-blue)"/>
