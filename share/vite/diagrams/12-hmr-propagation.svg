<tspan x="603" dy="0">否</tspan>
</text>
<path d="M580 752.0 L723.0 797 L580 842.0 L437.0 797 Z" fill="#edf6fc" stroke="#17659b" stroke-width="1.7"/>
<text class="hp-label" x="580" y="804.0" text-anchor="middle">
<tspan x="580" dy="0">node 自接受？</tspan>
</text>
<path d="M437 797 L336 797" fill="none" stroke="#17659b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hp-arrow-blue)"/>
