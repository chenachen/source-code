<path d="M798 180 C750 180 749 295 728 312" fill="none" stroke="#8296a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hp-arrow-line)"/>
<path d="M470 290 C439 257 318 254 273 224" fill="none" stroke="#17659b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hp-arrow-blue)"/>
