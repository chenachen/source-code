</text>
<path id="hp-recursion-true-return" d="M740 1964 L1139 1964 L1139 1040 L1114 1040" fill="none" stroke="#b13b42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hp-arrow-red)"/>
<text class="hp-small" x="931" y="1951" text-anchor="middle" style="fill:#b13b42">
<tspan x="931" dy="0">true：立即向上传 dead end</tspan>
