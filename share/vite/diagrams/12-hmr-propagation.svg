<text class="hp-label" x="188.0" y="652.5" text-anchor="middle">
<tspan x="188.0" dy="0">停止递归 · return false</tspan>
<tspan x="188.0" dy="25">不增加边界，不判死端</tspan>
</text>
<path d="M580 706 L580 752" fill="none" stroke="#17659b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hp-arrow-blue)"/>
