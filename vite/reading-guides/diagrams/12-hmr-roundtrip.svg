<tspan x="47" dy="0">条件性示意：若 #2 先到达、#1 尚未结束，只入队。</tspan>
<tspan x="47" dy="24">网络返回与 afterUpdate #1 没有固定先后。</tspan>
</text>
<rect x="36" y="315" width="240" height="116" rx="12" fill="#f0f4f7" stroke="#8296a8" stroke-width="1.7"/>
<text class="hr-small" x="156.0" y="342.5" text-anchor="middle">
