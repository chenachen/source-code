<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1940" viewBox="0 0 1160 1940" role="img" aria-labelledby="hr-title hr-desc" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<title id="hr-title">普通 HMR：child invalidate 的两轮跨角色时序</title>
<desc id="hr-desc">Vite v8.2.1，playground/hmr/invalidation。Watcher 先等待 watchChange 并清转换缓存，再进入 HMR 边界计算；传播后写 HMR timestamp。第一轮更新 child，HMRClient 冻结旧回调，有 disposer 时等待 dispose，再导入新 child，同步旧 callback 发送 vite:invalidate，不等待 callback 返回的 Promise。服务端对首个上报去重，从 child.importers 的 parent 重新传播，复用 timestamp 与 firstInvalidatedBy=child。若第二轮 payload 在第一轮 handler 结束前到达，只能排队。parent 重执行读取新 child 并写 DOM。蓝色阴影只画实现允许的交叠，测试未测网络先后。</desc>
<defs>
<marker id="hr-arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#17659b"/></marker>
<marker id="hr-arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18734a"/></marker>
<marker id="hr-arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b13b42"/></marker>
<marker id="hr-arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8296a8"/></marker>
</defs>
<style>.hr-title{font-weight:700;fill:#17324d;font-size:30px} .hr-section{font-weight:700;fill:#17324d;font-size:23px} .hr-label{fill:#17324d;font-size:19px} .hr-small{fill:#456078;font-size:17px} .hr-edge{font-size:18px;fill:#17659b;font-weight:600} .hr-role{font-size:20px;fill:#17324d;font-weight:700}</style>
<rect x="0" y="0" width="1160" height="1940" rx="0" fill="#f7fafc"/>
<text class="hr-title" x="38" y="47" text-anchor="start">
