<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1740" viewBox="0 0 1160 1740" role="img" aria-labelledby="sr-title sr-desc">
<title id="sr-title">SSR 协议如何进入 Module Runner</title>
<desc id="sr-desc">跨 ServerEnvironment、Transport、ModuleRunner 与 Evaluator 的时序。首次内部模块请求生产 getter 与 await import 协议代码；Runner 删除临时元信息 Promise，但保留节点求值 Promise。再次导入通过双向缓存握手决定复用旧状态或失效后重跑。输入为 cyclic2/test1：index 先求值 dep1，再求值 dep2；dep2 导回 index。</desc>
<defs>
  <marker id="sr-blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
  <marker id="sr-green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker>
  <marker id="sr-amber-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/></marker>
  <marker id="sr-gray-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
</defs>
<style>
.sr-title { font: 700 30px -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
.sr-section { font: 700 24px -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
.sr-text { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #253247; }
.sr-code { font-family: "SFMono-Regular", Consolas, "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace; fill: #253247; }
.sr-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style>

<rect width="1160" height="1740" fill="#fbfcfe"/>
<text class="sr-title" x="40" y="49">SSR 协议 → 缓存握手 → Runner 求值</text>
<text class="sr-text" x="40" y="85" font-size="20" text-anchor="start">
<tspan x="40" dy="0">同一输入：cyclic2/test1；index 先 dep1，后 dep2；dep2 再导入 index。</tspan>
</text>
<text class="sr-text" x="40" y="116" font-size="18" text-anchor="start" style="fill:#526079">
<tspan x="40" dy="0">实线：调用 / 处理；虚线：异步响应 / 返回值。纵向表示执行先后。</tspan>
</text>
<rect x="58" y="145" width="224" height="73" rx="12" fill="#edf3fc" stroke="#9db3d4" stroke-width="1.5"/>
<text class="sr-text" x="170.0" y="175" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="170.0" dy="0">ServerEnvironment</tspan>
</text>
<text class="sr-text" x="170.0" y="203" font-size="16" text-anchor="middle">
<tspan x="170.0" dy="0">transformResult · 协议代码</tspan>
</text>
<path class="sr-line" d="M170 219 V1680" stroke="#64748b" stroke-dasharray="7 6"/>
<rect x="328" y="145" width="224" height="73" rx="12" fill="#edf3fc" stroke="#9db3d4" stroke-width="1.5"/>
<text class="sr-text" x="440.0" y="175" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="440.0" dy="0">Transport</tspan>
</text>
<text class="sr-text" x="440.0" y="203" font-size="16" text-anchor="middle">
<tspan x="440.0" dy="0">invoke(fetchModule)</tspan>
</text>
<path class="sr-line" d="M440 219 V1680" stroke="#64748b" stroke-dasharray="7 6"/>
<rect x="618" y="145" width="224" height="73" rx="12" fill="#edf3fc" stroke="#9db3d4" stroke-width="1.5"/>
<text class="sr-text" x="730.0" y="175" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="730.0" dy="0">ModuleRunner</tspan>
</text>
<text class="sr-text" x="730.0" y="203" font-size="16" text-anchor="middle">
<tspan x="730.0" dy="0">meta · Promise · exports</tspan>
</text>
<path class="sr-line" d="M730 219 V1680" stroke="#64748b" stroke-dasharray="7 6"/>
<rect x="888" y="145" width="224" height="73" rx="12" fill="#edf3fc" stroke="#9db3d4" stroke-width="1.5"/>
<text class="sr-text" x="1000.0" y="175" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="1000.0" dy="0">Evaluator</tspan>
</text>
<text class="sr-text" x="1000.0" y="203" font-size="16" text-anchor="middle">
<tspan x="1000.0" dy="0">AsyncFunction · context</tspan>
</text>
<path class="sr-line" d="M1000 219 V1680" stroke="#64748b" stroke-dasharray="7 6"/>
<rect x="596" y="242" width="268" height="99" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="sr-text" x="730.0" y="272" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="730.0" dy="0">cachedModule(index)</tspan>
</text>
<text class="sr-text" x="730.0" y="300" font-size="18" text-anchor="middle">
<tspan x="730.0" dy="0">按 URL 合并并发元信息请求</tspan>
<tspan x="730.0" dy="25">临时 Promise；完成后删除</tspan>
</text>
<text class="sr-code" x="580" y="365" font-size="18" text-anchor="middle">
<tspan x="580" dy="0">fetchModule(index, options)</tspan>
</text>
<text class="sr-code" x="580" y="390" font-size="17" text-anchor="middle">
<tspan x="580" dy="0">cached:false + startOffset</tspan>
</text>
<path class="sr-line" d="M730 407 H440" stroke="#2563eb" marker-end="url(#sr-blue-arrow)"/>
<text class="sr-code" x="305" y="437" font-size="18" text-anchor="middle">
<tspan x="305" dy="0">fetchModule(url, importer)</tspan>
</text>
<path class="sr-line" d="M440 451 H170" stroke="#2563eb" marker-end="url(#sr-blue-arrow)"/>
<rect x="36" y="464" width="268" height="141" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="sr-text" x="170.0" y="494" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="170.0" dy="0">生产 internal 模块协议</tspan>
</text>
<text class="sr-text" x="170.0" y="522" font-size="17" text-anchor="middle">
<tspan x="170.0" dy="0">请求前 transformResult 为空</tspan>
<tspan x="170.0" dy="25">transformRequest → ssrTransform</tspan>
<tspan x="170.0" dy="25">getter / await import / map</tspan>
</text>
<text class="sr-code" x="305" y="637" font-size="18" text-anchor="middle">
<tspan x="305" dy="0">code / id / url / file</tspan>
</text>
<text class="sr-code" x="305" y="661" font-size="17" text-anchor="middle">
<tspan x="305" dy="0">invalidate: !cached = true</tspan>
</text>
<path class="sr-line" d="M170 678 H440" stroke="#0f766e" marker-end="url(#sr-green-arrow)" stroke-dasharray="7 6"/>
<text class="sr-text" x="585" y="709" font-size="19" text-anchor="middle">
<tspan x="585" dy="0">返回 internal 协议</tspan>
</text>
<path class="sr-line" d="M440 727 H730" stroke="#0f766e" marker-end="url(#sr-green-arrow)" stroke-dasharray="7 6"/>
<rect x="596" y="753" width="268" height="110" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="sr-text" x="730.0" y="783" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="730.0" dy="0">ensureModule(id, url)</tspan>
</text>
<text class="sr-text" x="730.0" y="811" font-size="17" text-anchor="middle">
<tspan x="730.0" dy="0">invalidate 旧状态，再写 meta</tspan>
<tspan x="730.0" dy="25">元信息请求 finally 删除 URL</tspan>
</text>
<rect x="596" y="887" width="268" height="111" rx="12" fill="#f0fdfa" stroke="#9ccbc3" stroke-width="1.5"/>
<text class="sr-text" x="730.0" y="917" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="730.0" dy="0">cachedRequest(index)</tspan>
</text>
<text class="sr-text" x="730.0" y="945" font-size="18" text-anchor="middle">
<tspan x="730.0" dy="0">登记 mod.promise = Pindex</tspan>
<tspan x="730.0" dy="25">执行前写入 mod.exports</tspan>
</text>
<text class="sr-code" x="867" y="1030" font-size="17" text-anchor="middle">
<tspan x="867" dy="0">runInlinedModule(context, code)</tspan>
</text>
<path class="sr-line" d="M730 1050 H1000" stroke="#2563eb" marker-end="url(#sr-blue-arrow)"/>
<rect x="866" y="1074" width="268" height="127" rx="12" fill="#f0fdfa" stroke="#9ccbc3" stroke-width="1.5"/>
<text class="sr-text" x="1000.0" y="1104" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="1000.0" dy="0">执行转换后的 index</tspan>
</text>
<text class="sr-text" x="1000.0" y="1132" font-size="17" text-anchor="middle">
<tspan x="1000.0" dy="0">先注册 dep1 / dep2 getter</tspan>
<tspan x="1000.0" dy="25">await dep1 → await dep2</tspan>
<tspan x="1000.0" dy="25">dep2 → index：取部分 exports</tspan>
</text>
<text class="sr-text" x="863" y="1234" font-size="18" text-anchor="middle" style="fill:#0f766e">
<tspan x="863" dy="0">dep2 完成 → index 完成</tspan>
</text>
<path class="sr-line" d="M1000 1252 H730" stroke="#0f766e" marker-end="url(#sr-green-arrow)" stroke-dasharray="7 6"/>
<rect x="596" y="1274" width="268" height="85" rx="12" fill="#f0fdfa" stroke="#9ccbc3" stroke-width="1.5"/>
<text class="sr-text" x="730.0" y="1304" font-size="20" text-anchor="middle" font-weight="650">
<tspan x="730.0" dy="0">finally: evaluated = true</tspan>
</text>
<text class="sr-text" x="730.0" y="1332" font-size="18" text-anchor="middle">
<tspan x="730.0" dy="0">Pindex 保留完成结果或拒绝</tspan>
</text>
<rect x="32" y="1390" width="1096" height="310" rx="12" fill="#f5f7fb" stroke="#abb8cc" stroke-width="1.5"/>
<text class="sr-section" x="50" y="1425">再次导入：先确认两端缓存，再决定是否复用求值</text>
<text class="sr-code" x="585" y="1458" font-size="18" text-anchor="middle">
<tspan x="585" dy="0">fetchModule(cached:true)</tspan>
</text>
<path class="sr-line" d="M730 1476 H440" stroke="#2563eb" marker-end="url(#sr-blue-arrow)"/>
<text class="sr-text" x="305" y="1508" font-size="18" text-anchor="middle">
<tspan x="305" dy="0">Runner 声明：已有 meta</tspan>
</text>
<path class="sr-line" d="M440 1526 H170" stroke="#2563eb" marker-end="url(#sr-blue-arrow)"/>
<text class="sr-text" x="54" y="1562" font-size="18" text-anchor="start" style="fill:#0f766e">
<tspan x="54" dy="0">服务端仍有 transformResult</tspan>
</text>
<text class="sr-code" x="307" y="1590" font-size="18" text-anchor="middle" style="fill:#0f766e">
<tspan x="307" dy="0">{ cache: true }</tspan>
</text>
<path class="sr-line" d="M170 1603 H440" stroke="#0f766e" marker-end="url(#sr-green-arrow)" stroke-dasharray="7 6"/>
<text class="sr-text" x="585" y="1590" font-size="18" text-anchor="middle" style="fill:#0f766e">
<tspan x="585" dy="0">旧 meta → 复用同一个 P</tspan>
</text>
<path class="sr-line" d="M440 1603 H730" stroke="#0f766e" marker-end="url(#sr-green-arrow)" stroke-dasharray="7 6"/>
<text class="sr-text" x="778" y="1609" font-size="17" text-anchor="start">
<tspan x="778" dy="0">返回 namespace / 同一 Error</tspan>
</text>
<text class="sr-text" x="54" y="1646" font-size="18" text-anchor="start" style="fill:#b45309">
<tspan x="54" dy="0">服务端已无 transformResult</tspan>
</text>
<text class="sr-code" x="307" y="1674" font-size="17" text-anchor="middle" style="fill:#b45309">
<tspan x="307" dy="0">code + invalidate:true</tspan>
</text>
<path class="sr-line" d="M170 1687 H440" stroke="#b45309" marker-end="url(#sr-amber-arrow)" stroke-dasharray="7 6"/>
<text class="sr-text" x="585" y="1674" font-size="17" text-anchor="middle" style="fill:#b45309">
<tspan x="585" dy="0">清旧执行状态 → 重新求值</tspan>
</text>
<path class="sr-line" d="M440 1687 H730" stroke="#b45309" marker-end="url(#sr-amber-arrow)" stroke-dasharray="7 6"/>
<text class="sr-text" x="40" y="1720" font-size="16" text-anchor="start" style="fill:#526079">
<tspan x="40" dy="0">源码：ssr/fetchModule.ts · ssr/ssrTransform.ts · module-runner/runner.ts · esmEvaluator.ts</tspan>
</text>
</svg>
